services:
  fmkal-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: https://fmkal.com
      CONTACT_EMAIL: iletisim@fmkal.com
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      SQLITE_DB_PATH: /app/data/fmkal.db
    volumes:
      - fmkal-data:/app/data
    networks:
      - coolify

volumes:
  fmkal-data:

networks:
  coolify:
    external: true